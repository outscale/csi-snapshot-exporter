name: E2E tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "Dockerfile"
      - "Makefile"
      - "go.*"
      - ".github/workflows/test-e2e.yml"

permissions:
  contents: read
  id-token: write

jobs:
  test-e2e:
    name: Run E2E test suite
    runs-on: [self-hosted, linux, local]
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⬇️ Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: ⬇️ Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.37.2
      - name: ⬇️ Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: 🧹 Frieza
        id: secrets
        uses: outscale/.github/vault-frieza-clean@98c7b1b43a6ffe54858f960aee70c98991035bff # v1.5.0
        with:
          vault_role: outscale-k8s-image-preloader
          exclude_resource_types: access_key
          providers: "outscale_oapi,outscale_oos"
      - name: ⬇️ Install octl
        uses: outscale/octl/.github/actions/setup_octl@b5e8714f317ca1625a4a4a8705c649d90bac4f72 # v0.0.34
        with:
          OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
          OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
          OSC_REGION: ${{ steps.secrets.outputs.region }}
      - name: ⬇️ Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/${{ vars.KIND_VERSION }}/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: 🔎 Verify kind installation
        run: kind version
      - name: 👷 Create bucket if necessary
        run: |
          BUCKET_NAME=`echo csi-export-${{ runner.name }}|tr '[:upper:]' '[:lower:]'|sed -r 's/-[a-z0-9]+$//'|cut -c1-32|sed -r 's/[^a-z0-9-]+/-/g'`
          octl storage bucket desc $BUCKET_NAME || octl storage bucket create --bucket $BUCKET_NAME
          echo "EXPORT_BUCKET=$BUCKET_NAME" | tee -a $GITHUB_ENV
      - name: 📦 Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: 'v2.15.4'
          args: release --clean --snapshot
      - name: 🧪 Run e2e tests
        timeout-minutes: 40
        run: |
          go mod tidy
          make test-e2e
        env:
          KIND_IMAGE: ${{ vars.KIND_IMAGE }}
          KIND_CLUSTER: ${{ steps.secrets.outputs.osc_account }}
          IMAGE: "outscale/csi-snapshot-exporter:${{ github.sha }}-amd64"
      - name: 🧹 Destroy kind cluster
        if: ${{ always() }}
        timeout-minutes: 10
        run: |
          make cleanup-test-e2e
        env:
          KIND_CLUSTER: ${{ steps.secrets.outputs.osc_account }}
