name: E2E tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "Dockerfile"
      - "Makefile"
      - "go.*"
      - ".github/workflows/test-e2e.yml"

permissions:
  contents: read

jobs:
  test-e2e:
    name: Run E2E test suite
    runs-on: [self-hosted, linux]
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔐 Set ak/sk name based on runner region
        run: .github/scripts/runneraksk.sh
      - name: ⬇️ Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: ⬇️ Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.32.9
      - name: ⬇️ Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2
      - name: ⬇️ Install octl
        uses: outscale/octl/.github/actions/setup_octl@29f89fd6d31b0d9180f182b8eb85904afb4231fc # v0.0.30
        with:
          OSC_ACCESS_KEY: ${{ secrets[env.OSC_ACCESS_KEY_NAME] }}
          OSC_SECRET_KEY: ${{ secrets[env.OSC_SECRET_KEY_NAME] }}
          OSC_REGION: ${{ env.OSC_REGION }}
      - name: ⬇️ Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/${{ vars.KIND_VERSION }}/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: 🔎 Verify kind installation
        run: kind version
      - name: 🧹 Frieza
        uses: outscale/frieza-github-actions/frieza-clean@1a8eba5199913da60ae6d92d6050e17410186a38 # v0.16.1+hotfix.0
        with:
          access_key: ${{ secrets[env.OSC_ACCESS_KEY_NAME] }}
          secret_key: ${{ secrets[env.OSC_SECRET_KEY_NAME] }}
          region: ${{ env.OSC_REGION }}
          exclude_resource_types: access_key
          providers: "outscale_oapi,outscale_oos"
      - name: 👷 Create bucket if necessary
        run: |
          BUCKET_NAME=`echo csi-export-${{ runner.name }}|tr '[:upper:]' '[:lower:]'|sed -r 's/-[a-z0-9]+$//'|cut -c1-32|sed -r 's/[^a-z0-9-]+/-/g'`
          octl storage bucket desc $BUCKET_NAME || octl storage bucket create --bucket $BUCKET_NAME
          echo "EXPORT_BUCKET=$BUCKET_NAME" | tee -a $GITHUB_ENV
      - name: 📦 Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: 'v2.15.4'
          args: release --clean --snapshot
      - name: 🧪 Run e2e tests
        run: |
          go mod tidy
          make test-e2e
        env:
          OSC_ACCESS_KEY: ${{ secrets[env.OSC_ACCESS_KEY_NAME] }}
          OSC_SECRET_KEY: ${{ secrets[env.OSC_SECRET_KEY_NAME] }}
          KIND_IMAGE: ${{ vars.KIND_IMAGE }}
          IMAGE: "outscale/csi-snapshot-exporter:${{ github.sha }}-amd64"
      - name: 🧹 Destroy kind cluster
        if: ${{ always() }}
        run: |
          make cleanup-test-e2e
