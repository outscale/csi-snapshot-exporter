# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
        - "-s -w {{ if not .IsSnapshot }}-X {{ .ModulePath }}/internal/controller.Version=v{{.Version}}{{ end }}"
    main: ./cmd

changelog:
  use: github-native

release:
  draft: true
  name_template: "Release v{{.Version}}"

dockers_v2:
  - images:
      - "outscale/csi-snapshot-exporter"
    tags:
      - "v{{ .Version }}"
      - "{{ if .IsSnapshot }}{{ .FullCommit }}{{ end }}"
    platforms:
      - linux/amd64
    labels:
      "org.opencontainers.image.description": "csi-snapshot-exporter"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
    build_args:
      VERSION: "v{{ .Version }}"
